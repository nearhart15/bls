name: Backfill LeagueSecretary Beer history

on:
  push:
    branches: [beer-league-pdf-import-test]
    paths:
      - scripts/backfill-leaguesecretary-history.mjs
      - .github/workflows/backfill-leaguesecretary-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaguesecretary-beer-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beer-league-pdf-import-test
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests before import
        run: npm test

      - name: Backfill qualifying LeagueSecretary weeks
        run: node scripts/backfill-leaguesecretary-history.mjs

      - name: Commit generated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/leaguesecretary-beer-history
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Backfill LeagueSecretary Beer history"
          git push origin HEAD:beer-league-pdf-import-test
