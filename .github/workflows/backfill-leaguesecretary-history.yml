name: Backfill LeagueSecretary Beer history

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaguesecretary-beer-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    permissions:
      contents: write
      actions: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests before import
        run: npm test

      - name: Backfill qualifying LeagueSecretary weeks
        run: node scripts/backfill-leaguesecretary-history.mjs

      - name: Commit changed data and request validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commit-import.mjs "Backfill LeagueSecretary Beer history" public/data/leaguesecretary-beer-history
