name: Backfill LeagueSecretary Beer history

on:
  push:
    branches: [beer-league-pdf-import-test]
    paths:
      - scripts/backfill-leaguesecretary-history.mjs
      - scripts/security-utils.mjs
      - .github/workflows/backfill-leaguesecretary-history.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaguesecretary-beer-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    permissions:
      contents: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beer-league-pdf-import-test
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run tests before import
        run: npm test

      - name: Backfill qualifying LeagueSecretary weeks
        run: node scripts/backfill-leaguesecretary-history.mjs

      - name: Commit generated history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/leaguesecretary-beer-history
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Backfill LeagueSecretary Beer history"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:beer-league-pdf-import-test
