name: Test Beer League source discovery

on:
  push:
    branches: [beer-league-pdf-import-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beer-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Follow Beer League page to current standings PDF
        run: node tests/beer-league-source.cjs
