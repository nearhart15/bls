name: Probe historical LeagueSecretary report source

on:
  push:
    branches: [beer-league-pdf-import-test]
    paths:
      - scripts/probe-leaguesecretary-history-source.mjs
      - .github/workflows/probe-leaguesecretary-history-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beer-league-pdf-import-test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/probe-leaguesecretary-history-source.mjs
