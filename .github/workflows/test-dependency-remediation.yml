name: Test complete dependency remediation

on:
  push:
    branches:
      - fix/dependency-audit-force-test

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply all npm security remediations (test branch only)
        run: npm audit fix --force
      - name: Reinstall lockfile
        run: npm ci --ignore-scripts
      - name: Confirm audit is clean
        run: npm audit --audit-level=moderate
      - name: Run complete project checks
        run: npm run check
      - name: Commit lockfile if all checks pass
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: remediate vulnerable npm dependencies"
          git push
