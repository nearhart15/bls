name: Deploy Beer League preview

on:
  push:
    branches: [beer-league-pdf-import-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_PATH: preview/beer-league-pdf-import-test

jobs:
  build-and-deploy:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: production
          persist-credentials: false

      - name: Checkout preview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beer-league-pdf-import-test
          path: preview
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: preview/.nvmrc
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json

      - name: Build production site
        working-directory: production
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run build

      - name: Build Beer League preview
        working-directory: preview
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run build -- --base /bls/preview/beer-league-pdf-import-test/

      - name: Add preview to Pages artifact
        run: |
          mkdir -p "production/dist/${PREVIEW_PATH}"
          cp -a preview/dist/. "production/dist/${PREVIEW_PATH}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: production/dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
