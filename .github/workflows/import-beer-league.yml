name: Import Beer League standings

on:
  push:
    branches: [main]
    paths-ignore:
      - public/data/beer-league.json
      - public/data/beer-league-history/**
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

concurrency:
  # Both data writers update the same history index on main.
  group: beer-league-data-main
  cancel-in-progress: false

jobs:
  import:
    permissions:
      contents: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Import current Beer League standings
        run: node scripts/import-beer-league.mjs

      - name: Commit updated data and history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/beer-league.json public/data/beer-league-history; then
            echo "Beer League data and history are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/beer-league.json public/data/beer-league-history
          git diff --cached --check
          git commit -m "Update Beer League standings data"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" pull --rebase origin main
            if git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main before retrying."
          done
          echo "Could not publish standings after three push attempts."
          exit 1
