name: Import Beer League standings

on:
  push:
    branches: [main]
    paths-ignore:
      - public/data/beer-league.json
      - public/data/beer-league-history/**
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Import current Beer League standings
        run: node scripts/import-beer-league.mjs

      - name: Commit updated data and history
        run: |
          if git diff --quiet -- public/data/beer-league.json public/data/beer-league-history; then
            echo "Beer League data and history are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/beer-league.json public/data/beer-league-history
          git commit -m "Update Beer League standings data"
          git push origin HEAD:main
