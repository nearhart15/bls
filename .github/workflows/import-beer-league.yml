name: Import Beer League standings

# Code pushes already deploy the website. Running this data importer on every
# push caused a second Pages deployment when the importer completed.
# Keep scheduled/manual refreshes so bowling standings still update automatically.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

concurrency:
  # Both data writers update the same history index on main.
  group: beer-league-data-main
  cancel-in-progress: false

jobs:
  import:
    permissions:
      contents: write
      actions: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Import current Beer League standings
        run: node scripts/import-beer-league.mjs

      - name: Commit changed data and request validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commit-import.mjs "Update Beer League standings data" public/data/beer-league.json public/data/beer-league-history
