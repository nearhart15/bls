name: Backfill Beer League history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/backfill-beer-league-history.mjs
      - scripts/import-beer-league.mjs
      - scripts/security-utils.mjs
      - .github/workflows/backfill-beer-history.yml

permissions:
  contents: read

concurrency:
  group: beer-league-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    permissions:
      contents: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Discover and archive historical Beer League sheets
        run: node scripts/backfill-beer-league-history.mjs

      - name: Commit recovered history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/beer-league-history; then
            echo "No additional historical Beer League sheets were recovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/beer-league-history
          git diff --cached --check
          git commit -m "Backfill historical Beer League standings"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
