name: Backfill Beer League history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/backfill-beer-league-history.mjs
      - .github/workflows/backfill-beer-history.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Discover and archive historical Beer League sheets
        run: node scripts/backfill-beer-league-history.mjs

      - name: Commit recovered history
        run: |
          if git diff --quiet -- public/data/beer-league-history; then
            echo "No additional historical Beer League sheets were recovered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/beer-league-history
          git commit -m "Backfill historical Beer League standings"
          git push
