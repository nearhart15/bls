name: Backfill Beer League history

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize with the current-standings importer to preserve the shared index.
  group: beer-league-data-main
  cancel-in-progress: false

jobs:
  backfill:
    permissions:
      contents: write
      actions: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Discover and archive historical Beer League sheets
        run: node scripts/backfill-beer-league-history.mjs

      - name: Commit changed data and request validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/commit-import.mjs "Backfill historical Beer League standings" public/data/beer-league-history
