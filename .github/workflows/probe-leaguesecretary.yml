name: Probe LeagueSecretary public data

on:
  push:
    branches: [beer-league-pdf-import-test]
    paths:
      - scripts/probe-leaguesecretary.mjs
      - .github/workflows/probe-leaguesecretary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beer-league-pdf-import-test

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Probe LeagueSecretary page and bundles
        env:
          LEAGUESECRETARY_URL: https://www.leaguesecretary.com/bowling-centers/arapahoe-bowling-center/bowling-leagues/beer-fall-2026/league/recaps-png/133016
        run: node scripts/probe-leaguesecretary.mjs
