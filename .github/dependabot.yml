version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm-security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "10:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
